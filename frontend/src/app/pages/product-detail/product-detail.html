<div class="container mt-5">

  <a routerLink="/" class="button is-text mb-4">
    <i class="fas fa-arrow-left mr-2"></i> Volver al catálogo
  </a>

  @if (loading) {
    <div class="has-text-centered">
      <button class="button is-loading is-large is-white">Cargando...</button>
    </div>
  }

  @if (product) {
    <div class="columns">

      <div class="column is-6">
        <figure class="image is-4by3 mb-4 card">
          <img [src]="currentImage ? apiUrl + '/uploads/' + currentImage : 'https://bulma.io/assets/images/placeholders/1280x960.png'"
               alt="Producto"
               style="object-fit: contain;">
        </figure>

        <div class="columns is-mobile is-multiline">
          @for (img of product.images; track img.fileName) {
            <div class="column is-2">
              <figure class="image is-square is-clickable"
                      (click)="changeImage(img.fileName)"
                      [class.is-active-img]="currentImage === img.fileName">
                <img [src]="apiUrl + '/uploads/' + img.fileName" style="border-radius: 4px;">
              </figure>
            </div>
          }
        </div>
      </div>

      <div class="column is-5 is-offset-1">
        <h1 class="title is-2">{{ product.name }}</h1>
        <h2 class="subtitle is-4 has-text-success has-text-weight-bold">
          {{ product.price | currency:'USD' }}
        </h2>

        <hr>

        <div class="content">
          <p>{{ product.description }}</p>
        </div>

        <div class="tags are-medium mb-4">
          <span class="tag" [class.is-success]="product.stock > 0" [class.is-danger]="product.stock === 0">
            {{ product.stock > 0 ? 'En Stock: ' + product.stock : 'Agotado' }}
          </span>
        </div>

        <div class="field is-grouped">
          <div class="control">
            <button class="button is-primary is-medium"
                    (click)="addToCart()"
                    [disabled]="product.stock === 0">
              <span class="icon"><i class="fas fa-shopping-cart"></i></span>
              <span>Agregar al Carrito</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  }
</div>
