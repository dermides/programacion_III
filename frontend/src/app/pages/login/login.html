<div class="columns is-centered mt-6">
  <div class="column is-4">
    <div class="card">
      <header class="card-header">
        <p class="card-header-title has-text-centered is-justify-content-center">
          Iniciar Sesión
        </p>
      </header>
      <div class="card-content">

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="field">
            <label class="label">Email</label>
            <div class="control has-icons-left">
              <input class="input" type="email" placeholder="tu@email.com" formControlName="email"
                     [class.is-danger]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <span class="icon is-small is-left">
                <i class="fas fa-envelope"></i>
              </span>
            </div>
            @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
              <p class="help is-danger">Ingresa un email válido</p>
            }
          </div>

          <div class="field">
            <label class="label">Contraseña</label>
            <div class="control has-icons-left">
              <input class="input" type="password" placeholder="******" formControlName="password"
                     [class.is-danger]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              <span class="icon is-small is-left">
                <i class="fas fa-lock"></i>
              </span>
            </div>
          </div>

          <div class="field mt-5">
            <button class="button is-primary is-fullwidth" [disabled]="loginForm.invalid" type="submit">
              <strong>Entrar</strong>
            </button>
          </div>

        </form>

        <hr>
        <p class="has-text-centered">
          ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
        </p>

      </div>
    </div>
  </div>
</div>
