<div class="container mt-5">
  <div class="column is-6 is-offset-3">

    <div class="box">
      <h1 class="title has-text-centered">
        {{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}
      </h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="field">
          <label class="label">Nombre</label>
          <div class="control">
            <input class="input" type="text" formControlName="name">
          </div>
        </div>

        <div class="field">
          <label class="label">Descripción</label>
          <div class="control">
            <textarea class="textarea" formControlName="description"></textarea>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label">Precio ($)</label>
              <div class="control">
                <input class="input" type="number" formControlName="price">
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label">Stock</label>
              <div class="control">
                <input class="input" type="number" formControlName="stock">
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label">Imagen</label>
          <div class="file has-name is-fullwidth is-primary">
            <label class="file-label">
              <input class="file-input" type="file" (change)="onFileSelected($event)" accept="image/*">
              <span class="file-cta">
                <span class="file-icon"><i class="fas fa-upload"></i></span>
                <span class="file-label">Seleccionar archivo...</span>
              </span>
              <span class="file-name">
                {{ selectedFile?.name || 'Sin archivo seleccionado' }}
              </span>
            </label>
          </div>
          @if (isEditMode) {
            <p class="help">Deja esto vacío si no quieres cambiar la imagen actual.</p>
          }
        </div>

        <div class="field is-grouped is-grouped-centered mt-5">
          <div class="control">
            <a routerLink="/admin/products" class="button is-light">Cancelar</a>
          </div>
          <div class="control">
            <button class="button is-primary" type="submit" [disabled]="form.invalid">
              Guardar Producto
            </button>
          </div>
        </div>

      </form>
    </div>

  </div>
</div>
