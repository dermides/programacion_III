<div class="container mt-5">
  <div class="level">
    <div class="level-left">
      <h1 class="title">Inventario de Productos</h1>
    </div>
    <div class="level-right">
      <a routerLink="/admin/products/new" class="button is-primary">
        <span class="icon"><i class="fas fa-plus"></i></span>
        <span>Nuevo Producto</span>
      </a>
    </div>
  </div>

  <div class="box">
    <div class="field has-addons mb-4">
      <div class="control has-icons-left is-expanded">
        <input class="input" type="text" placeholder="Buscar por código o nombre..." (input)="filterProducts($event)">
        <span class="icon is-small is-left">
          <i class="fas fa-search"></i>
        </span>
      </div>
    </div>
    <table class="table is-fullwidth is-striped is-hoverable">
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of products(); track $index) {
        <tr>
          <td>{{ item.id }}</td>
          <td><strong>{{ item.name }}</strong></td>
          <td>{{ item.price | currency:'USD' }}</td>
          <td>
            <span class="tag" [class.is-danger]="item.stock === 0" [class.is-success]="item.stock > 0">
              {{ item.stock }}
            </span>
          </td>
          <td>
            <div class="buttons are-small">
              <a [routerLink]="['/admin/products/edit', item.id]" class="button is-info is-light">
                <i class="fas fa-edit"></i>
              </a>
              <button class="button is-danger is-light" (click)="deleteProduct(item.id)">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="5">No hay datos.</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
